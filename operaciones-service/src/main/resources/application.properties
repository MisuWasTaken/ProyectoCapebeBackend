spring.application.name=operaciones-service

server.port=${PORT:8083}
server.address=0.0.0.0

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:capebe_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.default_schema=operaciones
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health

inscripciones.service.url=${INSCRIPCIONES_SERVICE_URL:http://localhost:8082}

supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.bucket-name=${SUPABASE_BUCKET:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB