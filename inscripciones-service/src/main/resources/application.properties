spring.application.name=inscripciones-service

server.port=${PORT:8082}
server.address=0.0.0.0

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:capebe_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.default_schema=inscripciones
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health
vuelos.service.url=${VUELOS_SERVICE_URL:http://localhost:8081}
